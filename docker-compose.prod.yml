# =============================================================================
# CREDO HR-Portal - Produktions-Konfiguration (eigenstaendig, Port 3000)
# =============================================================================
# Deployment: docker compose -f docker-compose.prod.yml up -d --build
# Voraussetzung: .env mit allen Secrets
# Container: hr-portal-app, hr-portal-db
# DB-User: hrportal
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-portal-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
#      - NODE_ENV=production
      - DATABASE_URL=postgresql://hrportal:${DB_PASSWORD}@db:5432/hr_portal?schema=public
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal

  db:
    image: postgres:16-alpine
    container_name: hr-portal-db
    restart: unless-stopped
    volumes:
      - hr_portal_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_DB: hr_portal
      POSTGRES_USER: hrportal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrportal -d hr_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Kein Port-Exposure — nur aus dem app-Container erreichbar

volumes:
  hr_portal_data:
  uploads_data:

networks:
  internal:
    internal: true
