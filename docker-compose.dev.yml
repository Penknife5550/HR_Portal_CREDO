# =============================================
# CREDO HR-Portal - Docker Compose (Lokales Dev/Test)
# Start: docker compose -f docker-compose.dev.yml up --build
# =============================================

services:
  db:
    image: postgres:16-alpine
    container_name: credo-hr-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: credo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hr_portal
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credo -d hr_portal"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credo-hr-app-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://credo:${DB_PASSWORD}@db:5432/hr_portal?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      MAGIC_LINK_EXPIRY_HOURS: ${MAGIC_LINK_EXPIRY_HOURS:-720}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    volumes:
      - uploads_data_dev:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev:
    driver: local
  uploads_data_dev:
    driver: local
