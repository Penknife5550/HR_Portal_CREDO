# =============================================================================
# CREDO HR-Portal - Docker Compose (Produktion)
# =============================================================================
# Start: sudo docker compose up -d --build
# Container: hr-portal-app, hr-portal-db
# Reverse Proxy: Caddy (externes Netzwerk reverse_proxy)
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-portal-app
    restart: unless-stopped
    environment:
#      - NODE_ENV=production
      - DATABASE_URL=postgresql://hrportal:${DB_PASSWORD}@db:5432/hr_portal?schema=public
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - uploads_data:/app/uploads
      # Der Entrypoint legt hier vor jedem Schema-Abgleich einen pg_dump ab.
      # Ohne diese Einhaengung startet der Container nicht, sobald sich das
      # Schema geaendert hat -- bewusst: db push laeuft mit --accept-data-loss.
      - ./backups:/backups
    networks:
      - reverse_proxy
      - internal

  gotenberg:
    # Konvertiert .docx -> PDF (LibreOffice). Nur im internen Netz erreichbar,
    # NICHT am reverse_proxy (kein oeffentlicher Zugriff). Die App spricht den
    # Dienst ueber http://gotenberg:3000 an (siehe GOTENBERG_URL).
    image: gotenberg/gotenberg:8
    container_name: hr-portal-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-timeout=120s"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  db:
    image: postgres:16-alpine
    container_name: hr-portal-db
    restart: unless-stopped
    volumes:
      - hr_portal_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      POSTGRES_DB: hr_portal
      POSTGRES_USER: hrportal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrportal -d hr_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # Kein Port-Exposure — nur aus dem app-Container erreichbar

volumes:
  hr_portal_data:
  uploads_data:

networks:
  reverse_proxy:
    external: true
  internal:
    internal: true
